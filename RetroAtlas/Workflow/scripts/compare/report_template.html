d:#edf3f6;white-space:nowrap}.tag.primary{background:#e8f2f8;color:#33789c}.tag.yes{background:#e2f3ed;color:#16866b}.tag.warn{background:#fff0df;color:#a87930}.tag.red{background:#f9e4e5;color:#aa555d}.tag.purple{background:#eee8f8;color:#7d60ad}.tag.dim{background:#edf1f3;color:#607788}.pillbar{height:12px;border-radius:15px;display:flex;overflow:hidden;background:#eaf0f5;margin:13px 0}.pillbar span{height:100%;display:block}.legend{display:flex;flex-wrap:wrap;gap:13px;font-size:11px;color:#6a8090}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}.metric{display:grid;grid-template-columns:minmax(135px,1.2fr) 4fr 42px;gap:10px;align-items:center;margin:10px 0;font-size:12px}.meter{border-radius:15px;height:10px;background:#eef2f5;overflow:hidden}.meter>i{height:100%;border-radius:15px;display:block}.metric-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#647f90}.metric-number{text-align:right;color:#526f7e;font-weight:800;font-variant-numeric:tabular-nums}.categorygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.ctile{background:#fcfdfe;border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;transition:transform .12s}.ctile:hover{transform:translateY(-2px);border-color:#95c4cb}.ctile span{color:#8496a3;font-size:10px;font-weight:800}.ctile strong{display:block;font-size:26px;margin:2px 0;letter-spacing:-.04em}.ctile small{color:#8ca1ac;font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}.searchpanel{padding:16px 20px;display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(90px,1fr)) auto;gap:10px;background:#fbfdfe;border-bottom:1px solid var(--line)}input,select{border:1px solid #d8e4ec;border-radius:8px;background:white;min-width:0;padding:10px 11px;font-size:12px;color:#293f50}.btn{border:1px solid #b4ced6;background:white;color:#147184;font-size:12px;border-radius:8px;padding:9px 13px;font-weight:800}.btn:hover{filter:brightness(.96)}.btn.primary{color:white;border-color:#197d8c;background:#197d8c}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;text-align:left}th,td{padding:11px 13px;border-bottom:1px solid #e9f0f4}thead{background:#f6f9fb}th{font-size:10px;text-transform:uppercase;color:#7c90a0;letter-spacing:.03em;cursor:pointer}tbody tr:hover{background:#f2f9fa;cursor:pointer}td.id{font-weight:800;color:#176e83}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.reason{max-width:290px;overflow:hidden;text-overflow:ellipsis}td.genef{color:#50697b}.foot{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#8294a1;flex-wrap:wrap}.pager{display:flex;align-items:center;gap:9px}.empty{text-align:center;padding:70px 20px;color:#8194a2}.empty strong{display:block;font-size:16px;color:#4f7383}.drawer{position:fixed;inset:0;background:#10243777;z-index:90;display:none;justify-content:flex-end}.drawer.open{display:flex}.drawer-pane{background:white;width:min(960px,98vw);height:100%;overflow:auto;box-shadow:-30px 0 70px #07192225}.drawer-head{padding:20px 27px;background:#102437;color:white;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}.drawer-head h2{font-size:19px;margin:0}.drawer-body{padding:24px 27px 55px}.detailgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0 23px}.detailitem{border-radius:9px;border:1px solid #e0e9ef;background:#f9fbfc;padding:11px;min-width:0}.detailitem label{display:block;color:#8296a5;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.02em}.detailitem b{display:block;font-size:13px;margin-top:4px;overflow-wrap:anywhere}.sectionlabel{margin:20px 0 10px;font-size:14px}.samplecards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.samplecard{border:1px solid #dfebf1;border-radius:10px;overflow:hidden}.samplecard>strong{background:#f2f7fa;padding:12px 15px;display:block}.samplecontent{padding:12px 15px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini label{font-size:10px;text-transform:uppercase;letter-spacing:.025em;color:#8194a2;display:block}.mini b{overflow-wrap:anywhere;font-size:12px;font-weight:650}.md{font-size:13px;color:#456273;line-height:1.7}.md h1,.md h2,.md h3{color:#18354a;line-height:1.2;margin:23px 0 10px}.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:14px}.md p{margin:10px 0}.md li{margin:4px 0}.md ul{padding-left:21px}.md code{border-radius:4px;background:#eef3f7;padding:1px 4px;font:12px ui-monospace,monospace}.md table{white-space:normal}.md th,.md td{min-width:120px;vertical-align:top}.md pre{background:#eff3f6;overflow:auto;padding:15px;border-radius:8px}.md pre code{background:transparent}.methodstep{display:flex;gap:12px;align-items:flex-start;margin:13px 0}.methodstep .index{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border:1px solid #b9dce4;border-radius:8px;background:#e7f5f7;font-weight:900;color:#08798b}.methodstep p{margin:0;color:#657e8f;font-size:12px}.statusbar{padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:#fbfcfe}.statusbar label{font-size:12px;color:#6a8191}.statusbar button.active{background:#1c798a;color:white}.gt-flag{color:#aa555d;font-weight:900}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.label-help{font-size:11px;color:#8ca0ad}.utility{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.footnote{font-size:11px;color:#8999a7}

</style></head><body>
<header><div class="head"><div class="brand"><div class="brand-icon">⫷</div><div><strong>ATLAS</strong><small>PAIRWISE INSERTION EXPLORER</small></div></div><div class="head-side"><b id="samples">Sample A · Sample B</b><span id="comparisonid"></span></div></div></header>
<nav><div id="tabs" class="tabs"></div></nav><main id="main"></main>
<div id="drawer" class="drawer"><div class="drawer-pane"><div class="drawer-head"><h2 id="drawer-title">Locus details</h2><button id="drawer-close" class="btn">Close ×</button></div><div id="drawer-body" class="drawer-body"></div></div></div>
<script>
/* Offline, self-contained report; content comes from the supplied RDS. */
const DATA=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__BASE64__'),c=>c.charCodeAt(0))));
const COLOURS={PRIMARY_MATCH:'#287aa3',RESCUE:'#16866b',REVIEW:'#b77c37',NOT_CALLABLE:'#8966aa',DIFFERENTIAL:'#b25d60'};
const categories=[{id:'info',name:'INFO',sub:'Study overview'},{id:'quality',name:'QUALITY COMPARISON',sub:'Regional callability and depth'},{id:'PRIMARY_MATCH',name:'PRIMARY',sub:'High-confidence matches'},{id:'RESCUE',name:'RESCUE',sub:'Presence evidence'},{id:'REVIEW',name:'REVIEW',sub:'Ambiguities and genotype audit'},{id:'NOT_CALLABLE',name:'NOT CALLABLE',sub:'Unassessable regions'},{id:'DIFFERENTIAL',name:'DIFFERENTIAL',sub:'Strict candidate'}];
let current='info';const perPage=30,sts={};let reviewView='CLASSIFIED';
const E=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const txt=v=>(v===null||v===undefined||v===''||String(v)==='NA')?'NA':String(v);
const metadataLabel=v=>{const s=String(v??'').trim().toUpperCase();return ['','U','UNKNOW','UNKNOWN'].includes(s)?'Unknown':s;};
const F=v=>{if(v===null||v===undefined||v==='')return 'NA';if(typeof v==='number'){return Number.isInteger(v)?v.toLocaleString('en-US'):v.toLocaleString('en-US',{maximumFractionDigits:3})}return txt(v)};
const badge=(v,cl='dim')=>`<span class="tag ${cl}">${E(F(v))}</span>`;
const sortedChr=x=>{let q=String(x||'').replace(/^chr/i,'').toUpperCase();return /^\d+$/.test(q)?Number(q):({X:23,Y:24,MT:25,M:25}[q]||99)};
const C=k=>(DATA.counts||{})[k]||0;
const all=[...(DATA.primary||[]),...(DATA.rescue||[]),...(DATA.review||[]),...(DATA.not_callable||[]),...(DATA.differential||[])];
const idMap=new Map(all.map(x=>[x.id,x]));const gtFlags=(DATA.primary||[]).filter(z=>z.genotype_identity===false);
function go(id){current=id;history.replaceState(null,'','#'+id);navigation();render();window.scrollTo(0,0)}
function navigation(){document.getElementById('tabs').innerHTML=categories.map(c=>`<button data-go="${c.id}" class="${current===c.id?'active':''}">${E(c.name)}${c.id!=='info'&&c.id!=='quality'?` <span class="count">${F(C(c.id))}</span>`:''}</button>`).join('');document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}
function heading(ey,h,sub,stamp=''){return `<div class="pagehead"><div><p class="eyebrow">${E(ey)}</p><h1>${E(h)}</h1><p>${E(sub)}</p></div>${stamp?`<span class="stamp">${E(stamp)}</span>`:''}</div>`}
function kpi(label,value,sub){return `<div class="kpi"><label>${E(label)}</label><strong>${E(F(value))}</strong><small>${E(sub)}</small></div>`}
function colourbar(arr,total){return `<div class="pillbar">${arr.map(([name,n,col])=>`<span style="width:${total?100*n/total:0}%;background:${col}" title="${E(name)}: ${n}"></span>`).join('')}</div><div class="legend">${arr.map(([name,n,col])=>`<span><i style="background:${col}"></i>${E(name)} <b>${F(n)}</b></span>`).join('')}</div>`}
function metrics(arr,colour='#277c9c'){let max=Math.max(1,...arr.map(x=>x[1]));return arr.map(([k,v])=>`<div class="metric"><div class="metric-name" title="${E(k)}">${E(k)}</div><div class="meter"><i style="width:${Math.max(0,v/max*100)}%;background:${colour}"></i></div><div class="metric-number">${F(v)}</div></div>`).join('')}
function countby(rows,k){let m={};rows.forEach(z=>{let a=txt(z[k]);m[a]=(m[a]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function info(){let total=all.length,summary=[['PRIMARY_MATCH',C('PRIMARY_MATCH'),COLOURS.PRIMARY_MATCH],['RESCUE',C('RESCUE'),COLOURS.RESCUE],['REVIEW',C('REVIEW'),COLOURS.REVIEW],['NOT_CALLABLE',C('NOT_CALLABLE'),COLOURS.NOT_CALLABLE],['DIFFERENTIAL',C('DIFFERENTIAL'),COLOURS.DIFFERENTIAL]];
return heading('Population comparison · two-sample analysis','Pairwise insertion comparison','RetroAtlas pairwise comparison and classification of reconstructed mobile-element insertions',DATA.meta.reference_build||'GRCh38')+`<div class="kpis">${kpi('Samples compared',2,DATA.meta.sample_A+' / '+DATA.meta.sample_B)}${kpi('Population loci',total,'Mutually exclusive categories')}${kpi('Primary genotype discordance',gtFlags.length,'Flags within PRIMARY; no reclassification')}${kpi('Differential candidates',C('DIFFERENTIAL'),'Not molecular proof of absence')}</div>
<div class="note">${E(DATA.meta.rescue_policy)}. ${E(DATA.meta.sample_A)}: SEX ${E(metadataLabel(DATA.meta.sex_A))}, PROCEDENCE ${E(metadataLabel(DATA.meta.procedence_A))}. ${E(DATA.meta.sample_B)}: SEX ${E(metadataLabel(DATA.meta.sex_B))}, PROCEDENCE ${E(metadataLabel(DATA.meta.procedence_B))}. ${DATA.meta.mane_available?'Assembly-specific gene annotation enabled.':'Gene annotation unavailable for this reference; gene fields are unannotated.'}</div>
<div class="card"><div class="cardhead"><div><h2>Pairwise classification landscape</h2><p>Five exclusive output classes from the supplied comparison RDS</p></div>${badge(DATA.meta.compare_id,'primary')}</div><div class="cardbody">${colourbar(summary,total)}<div class="categorygrid" style="margin-top:20px">${categories.filter(c=>c.id!=='info'&&c.id!=='quality').map(c=>`<button class="ctile" data-target="${c.id}"><span>${E(c.name)}</span><strong>${F(C(c.id))}</strong><small>${E(c.sub)}</small></button>`).join('')}</div></div></div>
<div class="cols2"><div class="card"><div class="cardhead"><div><h2>PRIMARY matching quality</h2><p>Observed Q tiers · complete Q1–Q10 criteria below</p></div></div><div class="cardbody">${metrics([...countby(DATA.primary,'Q_LABEL')].sort((a,b)=>Number(b[0].replace('Q',''))-Number(a[0].replace('Q',''))),'#277c9c')}</div></div><div class="card"><div class="cardhead"><div><h2>Genotype identity</h2><p>Normalized ALT dosage agreement within comparable ploidy</p></div></div><div class="cardbody">${colourbar([['Concordant',C('PRIMARY_MATCH')-gtFlags.length,'#16866b'],['Discordant — review',gtFlags.length,'#b65c61']],C('PRIMARY_MATCH'))}<div class="note warn" style="margin-top:18px">${gtFlags.length} PRIMARY pairs have a discordant genotype. Their shared insertion identity remains a PRIMARY match; only their genotype is flagged for review. This does not mean an insertion was absent from either sample.</div><p class="footnote">ALT sequence alignment status is reported separately. Structural matching does not imply that two ALT sequences were aligned.</p></div></div></div>
<div class="card"><div class="cardhead"><div><h2>RetroAtlas Pairwise Comparison and Classification</h2><p>Method overview</p></div></div><div class="cardbody md" id="method-doc"></div></div>
<div class="cols2"><div class="card"><div class="cardhead"><div><h2>Category interpretation and Q criteria</h2><p>Criteria from the comparison RDS</p></div></div><div class="cardbody md" id="readme-doc"></div></div><div class="card"><div class="cardhead"><div><h2>Run configuration</h2><p>Effective RDS configuration, accompanying TSV and glossary</p></div></div><div class="cardbody"><div class="note">Values in the comparison RDS are treated as effective parameters. The supplied TSV is displayed for reference and any differences are identified.</div><div id="effective-params" style="margin-top:16px"></div><details style="margin-top:19px"><summary>Full resolved configuration</summary><p>Defaults plus overrides at report generation, including base, Single and Compare settings and resource limits. Inactive options may also appear. The RDS values above remain authoritative for the classified results.</p><div id="run-configuration"></div></details><details style="margin-top:19px"><summary style="font-weight:800;cursor:pointer;color:#277c91">Full parameter descriptions</summary><div class="md" id="parameter-doc"></div></details></div></div></div>`}
const categoryDescriptions={PRIMARY_MATCH:['Matched PRIMARY insertions','Directly reconstructed in both samples. Discordant genotypes are flagged for audit without altering the match.'],RESCUE:['Additional evidence in the opposite sample','Primary in one sample, supported by VCF, softclips, undermerge or structural fragments. Rescue may not establish genotype dosage.'],REVIEW:['Evidence requiring manual inspection','Ambiguous reconstruction, competing nearby loci and uncertain structural presence. This is not a negative result.'],NOT_CALLABLE:['No reliable negative comparison','Poor regional coverage or missing quality information prevents concluding absence.'],DIFFERENTIAL:['Strict differential candidates','PRIMARY in one sample without matching evidence in the other, after negative evidence and callability checks.']};
const columns={PRIMARY_MATCH:[['id','Pair ID'],['CHROM','Chrom'],['POS','Position'],['SVLEN','SVLEN A'],['B_SVLEN','SVLEN B'],['Gene','Gene'],['Q_LABEL','Q'],['dpos','ΔPOS'],['size_sim','Size similarity'],['A_GT','GT A'],['B_GT','GT B'],['gt_view','GT identity'],['event_class','Class']],RESCUE:[['id','Locus ID'],['CHROM','Chrom'],['POS','Position'],['SVLEN','SVLEN'],['Gene','Gene'],['event_class','Class'],['source_sample','PRIMARY sample'],['target_sample','Evidence sample'],['rescue_type','Rescue type'],['target_callable','Target callable'],['rescue_without_callability','Rescue without callability'],['vcf_n_alt_callers','ALT callers'],['reason','Decision reason']],REVIEW:[['id','Locus ID'],['CHROM','Chrom'],['POS','Position'],['SVLEN','SVLEN'],['Gene','Gene'],['event_class','Class'],['source_sample','PRIMARY sample'],['review_subtype','Subtype'],['reason','Review reason']],NOT_CALLABLE:[['id','Locus ID'],['CHROM','Chrom'],['POS','Position'],['SVLEN','SVLEN'],['source_sample','PRIMARY sample'],['target_sample','Target'],['reason','Reason']],DIFFERENTIAL:[['id','Locus ID'],['CHROM','Chrom'],['POS','Position'],['SVLEN','SVLEN'],['Gene','Gene'],['event_class','Class'],['source_sample','Present sample'],['target_sample','Compared sample'],['reason','Reason']]};
const why={DOSAGE_DISCORDANT:'Genotype dosage differs between samples (heterozygous vs homozygous ALT).',PLAUSIBLE_INTRASAMPLE_REPRESENTATION_LINK:'A nearby call in the same sample may represent the same locus or a different allele.',UNMATCHED_PRIMARY_WITHIN_PRIMARY_WINDOW:'A nearby PRIMARY call exists in the other sample but did not pass matching criteria.',LOCAL_STRUCTURAL_EVIDENCE_AMBIGUOUS:'Structural evidence exists nearby, but is not sufficient to establish the same insertion.',POSSIBLE_MULTIALLELIC_LOCUS_ALREADY_MATCHED:'A nearby representation may be an alternative allele of an already matched locus.',SECONDARY_EVIDENCE_AMBIGUOUS:'Additional evidence is present but not conclusive.',OPPOSITE_PRIMARY_WITHIN_500BP:'A nearby PRIMARY exists in the other sample, but was not paired.',POSSIBLE_MULTIALLELIC_OR_REDUNDANT_SOURCE_PRIMARY:'Nearby reconstructions may represent alleles, fragments or redundant calls.',ALT_GT_MULTICALLER:'Compatible ALT evidence from multiple SV callers.',ALT_GT_SINGLE_CALLER:'Compatible ALT evidence from one SV caller.',SOFTCLIP_ALT_MATCHES_AND_CLUSTER_NEAR_BREAKPOINT:'Softclipped sequences match the insertion and cluster near its breakpoint.',SOFTCLIP_ALT_MATCHES_SHIFTED_CLUSTER_REPRODUCED_IN_SOURCE:'Sequence-compatible softclips form a shifted cluster also seen at the source.',TARGET_CALLABLE_NO_ALT_NO_AMBIGUOUS_EVIDENCE:'Opposite sample is callable and no matching ALT or ambiguous nearby evidence was detected.'};
const reasonHuman=s=>why[String(s)]||txt(s).replaceAll('_',' ').toLowerCase().replace(/^./,x=>x.toUpperCase());
function dataFor(id){if(id==='PRIMARY_MATCH')return DATA.primary||[];if(id==='RESCUE')return DATA.rescue||[];if(id==='REVIEW')return reviewView==='GT'?(DATA.primary||[]).filter(z=>z.genotype_identity===false).map(z=>({...z,original_category:'PRIMARY_MATCH',gt_view:'REVIEW',reason:'DOSAGE_DISCORDANT',review_subtype:'GENOTYPE_DISCORDANCE',source_sample:DATA.meta.sample_A,SVLEN:z.SVLEN,event_class:z.event_class})):DATA.review||[];if(id==='NOT_CALLABLE')return DATA.not_callable||[];return DATA.differential||[]}
function viewCols(id){if(id==='REVIEW'&&reviewView==='GT')return [['id','PRIMARY pair ID'],['CHROM','Chrom'],['POS','Position'],['Q_LABEL','Q'],['A_GT','GT A'],['B_GT','GT B'],['genotype_identity_reason','Genotype reason'],['event_class','Class']];return columns[id]}

function showDetail(id,pairId){let z=(id==='REVIEW'&&reviewView==='GT'?dataFor(id):dataFor(id)).find(x=>x.id===pairId);if(!z)return;document.getElementById('drawer-title').textContent=(z.id||'Locus')+' · '+id.replaceAll('_',' ');let isPrimary=id==='PRIMARY_MATCH'||(id==='REVIEW'&&reviewView==='GT');let summary=isPrimary?[['Chromosome',z.CHROM],['Position A',z.POS],['Position B',z.B_POS],['Position difference (bp)',z.dpos],['Insertion size A',z.SVLEN],['Insertion size B',z.B_SVLEN],['Size similarity',z.size_sim!=null?(z.size_sim*100).toFixed(2)+'%':null],['Quality',z.Q_LABEL],['Gene',z.Gene],['Genomic region',z.Location],['Class agreement',z.class_match],['Event agreement',z.event_match],['Completeness agreement',z.completeness_match],['Sequence alignment status',z.seq_status],['Sequence identity',z.seq_identity],['Sequence coverage',z.seq_coverage],['Decision rule',reasonHuman(z.reason)],['Genotype concordance',z.genotype_identity===true?'TRUE':z.genotype_identity===false?'FALSE':'NA'],['Genotype interpretation',reasonHuman(z.genotype_identity_reason)]]:[['Chromosome',z.CHROM],['Position',z.POS],['Source SVLEN',z.SVLEN],['Gene',z.Gene],['Location',z.Location],['Class',z.event_class],['Event',z.event],['Completeness',z.completeness],['Decision',reasonHuman(z.reason)],['Review subtype',reasonHuman(z.review_subtype)],['Source sample',z.source_sample],['Evidence sample',z.target_sample],['Rescue type',z.rescue_type],['Candidate VCF callers',z.vcf_callers],['ALT callers',z.vcf_n_alt_callers],['VCF evaluation',reasonHuman(z.vcf_reason)],['Softclip resolution',z.clip_resolution],['Softclip reason',reasonHuman(z.clip_reason)],['Fragment evaluation',z.fragment_status],['Callability of opposite sample',z.target_callable],['Rescued despite non-callable region',z.rescue_without_callability]];

function markdown(s){let a=String(s||'').replaceAll('\r','').split('\n'),out=[],bullets=[],i=0,code=false;const inline=v=>E(v).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');function flush(){if(bullets.length){out.push('<ul>'+bullets.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>');bullets=[]}}while(i<a.length){let s=a[i].trim();if(s.startsWith('```')){flush();if(!code){out.push('<pre><code>');code=true}else{out.push('</code></pre>');code=false}i++;continue}if(code){out.push(E(a[i])+'\n');i++;continue}if(!s){flush();i++;continue}if(/^\|.*\|$/.test(s)&&a[i+1]&&/^[\s|:\-]+$/.test(a[i+1].trim())){flush();let h=s.replace(/^\||\|$/g,'').split('|');i+=2;let rr=[];while(i<a.length&&/^\|.*\|$/.test(a[i].trim())){let v=a[i].trim().replace(/^\||\|$/g,'').split('|');rr.push('<tr>'+v.map(x=>'<td>'+inline(x.trim())+'</td>').join('')+'</tr>');i++}out.push('<div class="tablewrap"><table><thead><tr>'+h.map(x=>'<th>'+inline(x.trim())+'</th>').join('')+'</tr></thead><tbody>'+rr.join('')+'</tbody></table></div>');continue}let m=s.match(/^(#{1,4})\s+(.*)/);if(m){flush();let h=Math.min(3,m[1].length);out.push(`<h${h}>${inline(m[2])}</h${h}>`);i++;continue}if(/^[-*]\s+/.test(s)){bullets.push(s.replace(/^[-*]\s+/,''));i++;continue}if(/^\d+[.)]\s+/.test(s)){bullets.push(s.replace(/^\d+[.)]\s+/,''));i++;continue}flush();out.push('<p>'+inline(s)+'</p>');i++}flush();return out.join('')}
function params(){let raw=DATA.effective_params||{},provided=DATA.provided_params||{}, keys=Object.keys(raw);let html='<div class="tablewrap"><table><thead><tr><th>Parameter</th><th>Effective (RDS)</th><th>Supplied TSV</th></tr></thead><tbody>';keys.forEach(k=>{let a=String(raw[k]??'NA'),b=provided[k]===undefined?'—':String(provided[k]),diff=provided[k]!==undefined&&b!==a;html+=`<tr><td class="mono">${E(k)}</td><td>${E(a)}</td><td>${E(b)}${diff?' '+badge('Check','warn'):''}</td></tr>`});html+='</tbody></table></div>';document.getElementById('effective-params').innerHTML=html;renderRunConfiguration()}

// QUALITY COMPARISON: paired genomic windows (independent of retrotransposon calls)
const quality=DATA.quality||null;
const qNum=x=>typeof x==='number'?x.toFixed(2):'NA';
const qualityBadge=x=>x>=0?`<span style="color:#16866b">+${qNum(x)}</span>`:`<span style="color:#b65c61">${qNum(x)}</span>`;
function qualityScatter(metric,chrom){
 if(!quality||!quality.scatter)return '<p>No paired genomic windows provided.</p>';
 const points=quality.scatter.filter(v=>(!chrom||v[0]===chrom)&&Number.isFinite(v[2])&&Number.isFinite(v[3])&&v[2]>=0&&v[3]>=0);
 // log10(max(1, depth)) keeps zero-depth windows visible at the origin.
 const logDepth=v=>Math.log10(Math.max(1,v));
 const ranges=quality.chr.filter(v=>!chrom||v.chr===chrom);
 const maxA=Math.max(1,...ranges.map(v=>logDepth(v.max_depth_A??1)),...points.map(v=>logDepth(v[2]))),maxB=Math.max(1,...ranges.map(v=>logDepth(v.max_depth_B??1)),...points.map(v=>logDepth(v[3])));
 const lo=62,w=700,h=470,pw=w-lo-24,ph=h-lo-24;
 const cx=v=>lo+logDepth(v)/maxA*pw,cy=v=>h-lo-logDepth(v)/maxB*ph;
 let ticks='';
 for(const f of [0,.25,.5,.75,1]){const x=lo+f*pw,y=h-lo-f*ph;ticks+=`<line x1="${x}" x2="${x}" y1="24" y2="${h-lo}" stroke="#e6eef3"/><text x="${x}" y="${h-lo+22}" text-anchor="middle" class="axislabel">${(f*maxA).toFixed(2)}</text><line x1="${lo}" x2="${w-24}" y1="${y}" y2="${y}" stroke="#e6eef3"/><text x="${lo-9}" y="${y+4}" text-anchor="end" class="axislabel">${(f*maxB).toFixed(2)}</text>`;}
 const dots=points.map(v=>`<circle cx="${cx(v[2]).toFixed(2)}" cy="${cy(v[3]).toFixed(2)}" r="2.3" fill="#168c9a" fill-opacity=".55"><title>${E(v[0])}: ${v[1]} Mb; A ${v[2]}×; B ${v[3]}×</title></circle>`).join('');
 return `<svg role="img" aria-label="Regional Mosdepth coverage A versus B, log10 scale" viewBox="0 0 ${w} ${h}" style="display:block;width:100%;max-width:900px;margin:auto"><style>.axislabel{font:11px system-ui;fill:#72899a}</style>${ticks}${dots}<text x="${w/2}" y="${h-7}" text-anchor="middle" fill="#4e697d" font-size="12">${E(quality.sample_A)} · log10 regional depth</text><text x="16" y="${h/2}" transform="rotate(-90,16,${h/2})" text-anchor="middle" fill="#4e697d" font-size="12">${E(quality.sample_B)} · log10 regional depth</text></svg><p class="footnote">${F(points.length)} sampled paired Mosdepth windows. Each axis uses its own maximum. Depths ≤ 1× are displayed at 0; hover for original depth.</p>`;
}

function setupQuality(){if(!quality||!quality.present)return;const choose=document.getElementById('quality-chrom');const redraw=()=>{document.getElementById('quality-scatter-coverage').innerHTML=qualityScatter('coverage',choose.value)};choose.onchange=redraw;redraw();document.getElementById('quality-csv').onclick=()=>{const keys=['chr','bp','n','callable_A','callable_B','delta_pp','callable_both','depth_A','depth_B','length_bp','evaluated_pct','lower_A','iqr_A','upper_A','lower_B','iqr_B','upper_B'];const csv=[keys.join(','),...quality.chr.map(r=>keys.map(k=>r[k]??'').join(','))].join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='ATLAS_quality_by_chromosome.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};}

function render(){document.getElementById('main').innerHTML=current==='info'?info():current==='quality'?qualityPage():section(current);if(current==='quality'){setupQuality();return}if(current==='info'){document.getElementById('method-doc').innerHTML=markdown(DATA.method);const docs=String(DATA.glossary||'').split('## 2. Configuration parameters');document.getElementById('readme-doc').innerHTML=markdown(docs[0]);document.getElementById('parameter-doc').innerHTML=markdown(docs.length>1?'## 2. Configuration parameters'+docs.slice(1).join('## 2. Configuration parameters'):DATA.glossary);params();document.querySelectorAll('[data-target]').forEach(x=>x.onclick=()=>go(x.dataset.target))}else{filterForm(current);drawTable(current)}}
document.getElementById('samples').textContent=DATA.meta.sample_A+' / '+DATA.meta.sample_B;document.getElementById('comparisonid').textContent=DATA.meta.compare_id||'';document.getElementById('drawer-close').onclick=closeDrawer;document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};window.onkeydown=e=>{if(e.key==='Escape')closeDrawer()};window.addEventListener('hashchange',()=>{let id=decodeURIComponent(location.hash.slice(1));if(categories.some(z=>z.id===id)){current=id;navigation();render()}});let h=decodeURIComponent(location.hash.slice(1));if(categories.some(c=>c.id===h))current=h;navigation();render();
